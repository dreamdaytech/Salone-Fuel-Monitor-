# Dynamic public routes still use the SPA shell; the client SEO layer replaces
# metadata with the exact canonical after the record loads.
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/transport-prices/*"
  to = "/index.html"
  status = 200

# Authenticated/application routes are intentionally not indexable.
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
