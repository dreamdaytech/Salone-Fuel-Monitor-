<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- Preload critical first-visible image for LCP -->
    <link rel="preload" as="image" href="/images/fuel_stations_sl_new.png" />

    <!-- DNS prefetch for external services -->
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin="anonymous" />

    <!-- Base metadata. RouteSEO replaces these values for every public route. -->
    <title>Fuel Prices in Sierra Leone Today | Salone Fuel Monitor</title>
    <meta name="title" content="Fuel Prices in Sierra Leone Today | Salone Fuel Monitor" />
    <meta name="description" content="Check current petrol, diesel and kerosene prices in Sierra Leone, find fuel stations, compare West African fuel prices, view price trends and monitor global oil movements." />
    <meta name="keywords" content="Sierra Leone fuel prices, petrol price Sierra Leone, diesel price Sierra Leone, kerosene price Sierra Leone, fuel stations Freetown, transport fares Sierra Leone, fuel monitor, salone fuel" />
    <meta name="author" content="DreamDay Technology Limited" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />

    <!-- Do not hard-code a canonical URL here. RouteSEO/prerendering sets the correct route canonical. -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://salonefuelmonitor.com/" />
    <meta property="og:title" content="Fuel Prices in Sierra Leone Today | Salone Fuel Monitor" />
    <meta property="og:description" content="Check current petrol, diesel and kerosene prices in Sierra Leone, find fuel stations, compare West African fuel prices, view price trends and monitor global oil movements." />
    <meta property="og:image" content="https://salonefuelmonitor.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Salone Fuel Monitor" />
    <meta property="og:site_name" content="Salone Fuel Monitor" />
    <meta property="og:locale" content="en_SL" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://salonefuelmonitor.com/" />
    <meta name="twitter:title" content="Fuel Prices in Sierra Leone Today | Salone Fuel Monitor" />
    <meta name="twitter:description" content="Check current petrol, diesel and kerosene prices in Sierra Leone, find fuel stations, compare West African fuel prices, view price trends and monitor global oil movements." />
    <meta name="twitter:image" content="https://salonefuelmonitor.com/og-image.png" />

    <!-- JSON-LD Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Salone Fuel Monitor",
      "url": "https://salonefuelmonitor.com",
      "description": "Sierra Leone fuel price transparency platform for petrol, diesel, kerosene, fuel stations, transport fares, regional comparison and oil-market analysis.",
      "publisher": {
        "@type": "Organization",
        "name": "DreamDay Technology Limited",
        "url": "https://dreamdaytech-sl.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://salonefuelmonitor.com/logo.png"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://salonefuelmonitor.com/stations?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Salone Fuel Monitor",
      "url": "https://salonefuelmonitor.com",
      "logo": "https://salonefuelmonitor.com/logo.png",
      "description": "An independent public-interest platform committed to fuel price transparency and energy-sector accountability in Sierra Leone.",
      "foundingLocation": {
        "@type": "Place",
        "name": "Freetown, Sierra Leone"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
